# The release tool (D-82, docs/UPDATES.md §5): the release key, the release manifest, its signature. Runs on the build
# machine that holds the release key; never shipped to users.
[package]
name = "antenna-release"
description = "Antenna release tool: generate the release key, build the release manifest from the release files, sign and verify it"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "antenna-release"
path = "src/main.rs"

[dependencies]
antenna-update = { workspace = true }
antenna-proto = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
data-encoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
