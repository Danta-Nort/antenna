# Signed releases and `antenna update` (SPEC §12, §13; DECISIONS D-82; format: docs/UPDATES.md).
# No custom cryptography (SPEC §7, §15): Ed25519 is `ed25519-dalek`, hashes are `sha2` and `blake3`, the same crates
# the rest of the workspace uses.
[package]
name = "antenna-update"
description = "Signed Antenna releases: the release manifest and its detached signature, the pinned release keys, and installing an update (macOS app, Linux binaries) with rollback"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

# On Windows rustix has no `process` and `fs`; the installer there is WP-29 (D-134).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
