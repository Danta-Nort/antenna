# Slice 4 "files and quarantine" (SPEC §7 "Files and streams", §10, §13, §15 "Files"): file encryption (STREAM), signed
# manifest, per-link store and ACL (iroh-blobs), quarantine, sandboxed check and CDR preview, acceptance. Member of the
# root workspace since stage B; in the product the check worker is a hidden `antennad` subcommand (SPEC §14: one binary),
# the `antenna-files-sandbox` binary is for this crate's tests.
[package]
name = "antenna-files"
description = "Files and quarantine for the Antenna daemon: STREAM file encryption, signed manifests, per-link blob stores (iroh-blobs), sandboxed checks and CDR previews, explicit acceptance, secret scanner"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["yara"]
# YARA-X inside the worker (BSD-3-Clause, wasmtime in Pulley interpreter mode, no JIT; see D-F-6).
yara = ["dep:yara-x"]

[[bin]]
name = "antenna-files-sandbox"
path = "src/bin/antenna-files-sandbox.rs"

[dependencies]
antenna-proto = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
data-encoding = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = "1"
rand = { workspace = true }

# Cryptography (SPEC §7, §14): only existing crates; same RustCrypto generation as libsignal (aead 0.6)
chacha20poly1305 = { workspace = true }
aead-stream = { version = "0.6.0", features = ["alloc"] }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }

# Transfer (verified by the spikes/iroh-blobs spike)
iroh = { workspace = true }
iroh-blobs = { workspace = true }

# File names
unicode-normalization = "0.1.25"

# Check and CDR: run only inside the sandbox worker
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
png = "0.18"
hayro = "0.7.1"
kurbo = "0.13"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"
yara-x = { version = "1.22.1", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "pulley"], optional = true }

# On Windows rustix has no `fs` and `process`; saving accepted files there is WP-21 (D-134)
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# Inherited descriptors never reach the worker, whoever starts it (D-61); all `unsafe` lives in `antenna-sys` (D-P-1)
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
antenna-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
