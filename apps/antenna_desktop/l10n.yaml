# SPDX-License-Identifier: AGPL-3.0-only
# gen-l10n (the official Flutter generator). All app strings live only here: lib/l10n/app_en.arb (template, English)
# and app_ru.arb (Russian). The generated lib/l10n/app_localizations*.dart sit next to them and are committed: the
# synthetic package (flutter_gen) was removed in Flutter 3.32+, and without generated files in the tree
# `flutter analyze` and CI would not build. Generation runs on `flutter pub get` / `flutter test` / `flutter run`;
# by hand: `flutter gen-l10n`. Details: docs/DESIGN.md, "Languages".
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
untranslated-messages-file: lib/l10n/untranslated.json
# The project's SPDX header goes into the generated files too.
header: |-
  // SPDX-License-Identifier: AGPL-3.0-only
  // Generated by `flutter gen-l10n` from lib/l10n/app_*.arb. Do not edit by hand (docs/DESIGN.md, "Languages").
